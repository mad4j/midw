[package]
name = "midw-local"
version = "0.1.0"
edition = "2021"
description = "In-process local node implementation (nodes A and B)"

[dependencies]
async-trait = "0.1"
midw-common = { path = "../midw-common" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
