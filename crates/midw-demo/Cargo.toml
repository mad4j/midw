[package]
name = "midw-demo"
version = "0.1.0"
edition = "2021"
description = "Full end-to-end demo: control node X drives local nodes A/B and IPC nodes C/D"

[[bin]]
name = "midw-demo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
midw-common = { path = "../midw-common" }
midw-control = { path = "../midw-control" }
midw-ipc = { path = "../midw-ipc" }
midw-local = { path = "../midw-local" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
