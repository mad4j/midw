[package]
name = "midw-common"
version = "0.1.0"
edition = "2021"
description = "Shared types, traits and protocol for the midw communication architecture"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
